# Optional: a websocket datasource for live rapid wind panels.
# Needs the golioth-websocket-datasource plugin and the collector's websocket
# server (WEATHERFLOW_COLLECTOR_PROVIDER_WEBSOCKET_SERVER_ENABLED=True).
# Replace <COLLECTOR_HOST> with an address your Grafana server can reach. Grafana
# Cloud can't reach a server on your LAN, so this is for a self-hosted Grafana.
apiVersion: 1
datasources:
  - name: websocket - weatherflow-collector
    type: golioth-websocket-datasource
    typeName: WebSocket API
    access: proxy
    basicAuth: false
    isDefault: false
    jsonData:
      host: 'ws://<COLLECTOR_HOST>:6789'
    readOnly: false
