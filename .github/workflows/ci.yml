name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build and scan image
    # The base images need registry credentials, which pull requests from
    # forks don't get, so those skip this job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Show base image digests
        run: |
          {
            echo "### Base image digests"
            for ref in $(grep -oE '^FROM [^ ]+' Dockerfile | cut -d' ' -f2 | sort -u); do
              echo "- \`${ref}\`: \`$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weatherflow-collector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm --read-only --cap-drop ALL \
            -e WEATHERFLOW_COLLECTOR_API_TOKEN=test-token \
            --entrypoint /venv/bin/python3 weatherflow-collector:ci \
            -c "import sys; sys.path.insert(0, '/app'); import aiohttp, influxdb_client, websockets, config, station_metadata_manager; print('ok')"
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weatherflow-collector:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
