[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# Start with the rules that catch real bugs (syntax errors, undefined names,
# unused imports); widen as the inherited code is cleaned up.
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/handlers/__init__.py" = ["F401"]
